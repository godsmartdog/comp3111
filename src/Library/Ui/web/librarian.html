<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Librarian Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header class="topbar page-top">
    <div>
        <h1>Librarian Portal</h1>
        <p id="welcomeLine"></p>
    </div>
    <div class="top-actions">
        <a class="link-btn" href="index.html">Main</a>
        <button id="logoutBtn" class="secondary">Logout</button>
    </div>
</header>

<main class="layout single-col" data-role="LIBRARIAN">
    <section class="panel glass-panel">
        <h2>Manage Profile</h2>
        <div class="split">
            <div>
                <div class="inline-row">
                    <label for="librarianProfileFullName">Full Name</label>
                    <input id="librarianProfileFullName" type="text" placeholder="Your full name">
                </div>
                <div class="inline-row">
                    <label for="librarianProfileEmployeeId">Employee ID</label>
                    <input id="librarianProfileEmployeeId" type="text" placeholder="EMP-001">
                </div>
                <div class="inline-row">
                    <label for="librarianProfilePassword">New Password</label>
                    <input id="librarianProfilePassword" type="password" placeholder="Leave blank to keep current password">
                </div>
                <button id="saveLibrarianProfileBtn" class="secondary" type="button">Save Profile</button>
                <p id="librarianProfileFeedback"></p>
            </div>
        </div>

        <h2>Pending Submissions</h2>
        <button id="refreshPendingBtn" class="secondary">Refresh Pending Submissions</button>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Submitted</th>
                    <th>File</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="pendingBody"></tbody>
            </table>
        </div>

        <h2>Approved Books</h2>
        <p id="approvedBooksStatus">Loading approved books...</p>
        <button id="refreshApprovedBooksBtn" class="secondary" type="button">Refresh Approved Books</button>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Publish Date</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="approvedBooksBody"></tbody>
            </table>
        </div>

        <h2>Notification Board</h2>
        <p id="librarianNotificationStatus">Loading notifications...</p>
        <button id="refreshLibrarianNotificationsBtn" class="secondary" type="button">Refresh Notifications</button>
        <ul id="librarianNotificationsList"></ul>
    </section>
</main>

<div id="toast"></div>
<script src="background-animation.js"></script>
<script src="shared.js"></script>
<script src="portal-librarian.js"></script>
</body>
</html>
