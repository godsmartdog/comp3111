<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Author Submitted</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header class="topbar page-top">
    <div>
        <h1>My Submitted Books</h1>
        <p id="welcomeLine"></p>
    </div>
    <div class="top-actions">
        <a class="link-btn" href="mainAuthor.html">Author Main</a>
        <button id="logoutBtn" class="secondary">Logout</button>
    </div>
</header>

<main class="layout single-col" data-role="AUTHOR">
    <section class="panel glass-panel">
        <p id="submittedStatus">Loading submitted books...</p>
        <div class="toolbar">
            <label><input id="submittedSelectAll" type="checkbox"> Select all visible</label>
            <button id="bulkDeleteSubmittedBtn" class="secondary" type="button" disabled>Delete Selected (0)</button>
        </div>
        <p class="hint" style="margin: 4px 0 8px 0; font-style: italic; opacity: 0.85;">
            Tip: select rows to bulk-delete. Only pending submissions you own can be deleted; other rows will be skipped with a reason.
        </p>
        <button id="loadSubmittedBtn" class="secondary" type="button">Refresh Submitted Books</button>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Select</th>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Submitted Date</th>
                    <th>File</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="submittedBooksBody"></tbody>
            </table>
        </div>

        <h3>Preview</h3>
        <div id="authorPreviewMeta" class="muted"></div>
        <iframe id="authorPreviewPdf" style="display:none;width:100%;height:360px;border:1px solid #d9d9d9;border-radius:8px;"></iframe>
        <div id="authorPreviewImageWrap" style="display:none;background:#f8f8f8;padding:12px;border-radius:8px;">
            <img id="authorPreviewImage" alt="Author preview" style="max-width:100%;height:auto;display:block;margin:auto;">
        </div>
        <pre id="authorPreviewText" style="display:none;white-space:pre-wrap;background:#f8f8f8;padding:12px;border-radius:8px;"></pre>
    </section>
</main>

<div id="toast"></div>
<script src="background-animation.js"></script>
<script src="shared.js"></script>
<script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="author-submitted.js"></script>
</body>
</html>
