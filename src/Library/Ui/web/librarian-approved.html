<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Librarian Approved</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header class="topbar page-top">
    <div>
        <h1>Approved Books</h1>
        <p id="welcomeLine"></p>
    </div>
    <div class="top-actions">
        <a class="link-btn" href="mainLibrarian.html">Librarian Main</a>
        <button id="logoutBtn" class="secondary">Logout</button>
    </div>
</header>

<main class="layout single-col" data-role="LIBRARIAN">
    <section class="panel glass-panel">
        <p id="approvedBooksStatus">Loading approved books...</p>
        <button id="refreshApprovedBooksBtn" class="secondary" type="button">Refresh Approved Books</button>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Publish Date</th>
                    <th>Status</th>
                    <th>Copies</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="approvedBooksBody"></tbody>
            </table>
        </div>
    </section>
</main>

<div id="toast"></div>
<script src="background-animation.js"></script>
<script src="shared.js"></script>
<script src="librarian-approved.js"></script>
</body>
</html>
