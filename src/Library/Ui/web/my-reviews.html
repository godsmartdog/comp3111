<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | My Reviews</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header class="topbar page-top">
    <div>
        <h1>My Reviews</h1>
        <p id="welcomeLine"></p>
    </div>
    <div class="top-actions">
        <a id="mainPortalLink" class="link-btn" href="mainStudent.html">Main Portal</a>
        <a id="booksPortalLink" class="link-btn" href="student-books.html">Books</a>
        <button id="logoutBtn" class="secondary">Logout</button>
    </div>
</header>

<main class="layout single-col" data-role="STUDENT_OR_STAFF">
    <section class="panel glass-panel">
        <h2>Submitted Ratings And Reviews</h2>
        <p id="reviewsStatus" class="hint">Loading reviews...</p>
        <button id="refreshReviewsBtn" class="secondary" type="button">Refresh</button>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Book</th>
                    <th>Rating</th>
                    <th>Review</th>
                    <th>Updated At</th>
                </tr>
                </thead>
                <tbody id="myReviewsBody"></tbody>
            </table>
        </div>
    </section>
</main>

<div id="toast"></div>
<script src="background-animation.js"></script>
<script src="shared.js"></script>
<script src="my-reviews.js"></script>
</body>
</html>
