<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Author Submission</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header class="topbar page-top">
    <div>
        <h1>Book Submission</h1>
        <p id="welcomeLine"></p>
    </div>
    <div class="top-actions">
        <a class="link-btn" href="mainAuthor.html">Author Main</a>
        <a class="link-btn" href="profile-author.html">Profile</a>
        <button id="logoutBtn" class="secondary">Logout</button>
    </div>
</header>

<main class="layout single-col" data-role="AUTHOR">
    <section class="panel glass-panel">
        <div class="form-grid">
            <label>Title</label>
            <input id="authorTitle" type="text" placeholder="Book title">

            <label>Genres</label>
            <select id="authorGenres" multiple size="8">
                <option value="Fiction">Fiction</option>
                <option value="Non-fiction">Non-fiction</option>
                <option value="Mystery">Mystery</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Science Fiction">Science Fiction</option>
                <option value="Romance">Romance</option>
                <option value="Thriller">Thriller</option>
                <option value="Biography">Biography</option>
                <option value="History">History</option>
                <option value="Business">Business</option>
                <option value="Education">Education</option>
                <option value="Science">Science</option>
                <option value="Technology">Technology</option>
                <option value="Art">Art</option>
                <option value="Philosophy">Philosophy</option>
                <option value="Self-Help">Self-Help</option>
                <option value="Children">Children</option>
                <option value="Young Adult">Young Adult</option>
            </select>
            <p class="hint">Hold Ctrl (Windows) or Cmd (Mac) to select multiple genres.</p>

            <label>File Path</label>
            <div class="file-row">
                <input id="authorFilePath" type="text" placeholder="C:/path/to/file.pdf">
                <button id="pickFileBtn" type="button" class="secondary file-btn">Browse...</button>
                <input id="authorFileInput" type="file" class="hidden" accept=".pdf,.docx,.jpg,.jpeg,.png,.doc,.txt,.md">
            </div>

            <label>Description</label>
            <textarea id="authorDescription" rows="6" placeholder="Book description"></textarea>
        </div>

        <div class="toolbar">
            <button id="autoSaveBtn" class="secondary">Auto Save Draft</button>
            <button id="loadDraftsBtn" class="secondary">Load Drafts</button>
            <button id="previewBtn" class="secondary">Preview</button>
            <button id="submitBtn">Submit for Review</button>
        </div>

        <h3>Saved Drafts</h3>
        <ul id="drafts"></ul>

        <h3>Preview</h3>
        <pre id="authorPreview"></pre>

        <h3>File Preview</h3>
        <div id="filePreview" class="file-preview">Choose a file to preview (PDF, DOCX, JPG/JPEG/PNG).</div>
    </section>
</main>

<div id="toast"></div>
<script src="background-animation.js"></script>
<script src="shared.js"></script>
<script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="author-submission.js"></script>
</body>
</html>
