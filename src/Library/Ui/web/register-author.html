<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Author Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<main class="center-wrap">
    <section class="panel glass-panel form-panel">
        <h1>Register Author</h1>

        <label for="username">Username</label>
        <input id="username" type="text" placeholder="author2">

        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" placeholder="Author Name">

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password1!">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" placeholder="Re-enter your password">
        <div class="policy-box">
            <strong>Password Policy</strong>
            <ul class="policy-list">
                <li>8 to 64 characters</li>
                <li>At least one uppercase letter</li>
                <li>At least one lowercase letter</li>
                <li>At least one digit</li>
                <li>At least one special character</li>
                <li>No spaces</li>
            </ul>
        </div>
        <div id="passwordError" class="field-error"></div>

        <label for="bio">Bio</label>
        <textarea id="bio" class="bio-compact" rows="3" placeholder="Write your author bio"></textarea>

        <button id="registerBtn" class="big-btn secondary">Register Author</button>

        <div class="quick-links">
            <a href="index.html">Back to Main</a>
            <a href="register.html?role=STUDENT">Other Role Register</a>
            <a href="login.html?role=AUTHOR">Author Login</a>
        </div>
    </section>
</main>

<div id="toast"></div>
<script src="background-animation.js"></script>
<script src="shared.js"></script>
<script src="register-author.js"></script>
</body>
</html>
