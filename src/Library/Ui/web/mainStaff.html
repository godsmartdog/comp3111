<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Staff Main</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header class="topbar page-top">
    <div>
        <h1>Staff Main Portal</h1>
        <p id="welcomeLine"></p>
    </div>
    <div class="top-actions">
        <a class="link-btn" href="profile-user.html">Profile</a>
        <a class="link-btn" href="index.html">Main</a>
        <button id="logoutBtn" class="secondary">Logout</button>
    </div>
</header>

<main class="layout single-col" data-role="STAFF">
    <section class="panel glass-panel">
        <h2>Staff Functions</h2>
        <p class="hint">Use one page per function.</p>
        <div class="quick-links staff-main-quick-links">
            <a class="link-btn" href="staff-books.html">Books Search and Borrow</a>
            <a class="link-btn" href="staff-borrows.html">My Active Borrows</a>
        </div>

        <h3>Notification Board</h3>
        <div id="notificationBox" class="panel-subtle">
            <p id="notificationStatus">Loading notifications...</p>
            <button id="refreshNotificationsBtn" class="secondary" type="button">Refresh Notifications</button>
            <ul id="notificationsList"></ul>
            <div class="pager-row">
                <button id="notificationPrevPageBtn" type="button" class="secondary pager-btn">&lt;</button>
                <span id="notificationPageInfo">1/1</span>
                <button id="notificationNextPageBtn" type="button" class="secondary pager-btn">&gt;</button>
            </div>
        </div>

        <h3>Popular Recommendations</h3>
        <div class="panel-subtle">
            <ul id="recommendations"></ul>
        </div>
    </section>
</main>

<div id="toast"></div>
<script src="background-animation.js"></script>
<script src="shared.js"></script>
<script src="main-staff.js"></script>
</body>
</html>
