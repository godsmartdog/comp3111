<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Manage Users</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header class="topbar page-top">
    <div>
        <h1>Manage All Users</h1>
        <p id="welcomeLine"></p>
    </div>
    <div class="top-actions">
        <a class="link-btn" href="mainLibrarian.html">Librarian Main</a>
        <a class="link-btn" href="profile-librarian.html">Profile</a>
        <button id="logoutBtn" class="secondary">Logout</button>
    </div>
</header>

<main class="layout single-col" data-role="LIBRARIAN">
    <section class="panel glass-panel">
        <div class="toolbar">
            <input id="userSearchInput" type="text" placeholder="Search by username or full name">
            <select id="userRoleFilter">
                <option value="all" selected>All Roles</option>
                <option value="student">Student</option>
                <option value="staff">Staff</option>
                <option value="author">Author</option>
                <option value="librarian">Librarian</option>
            </select>
            <select id="userStatusFilter">
                <option value="all" selected>All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
            <button id="applyUserFiltersBtn" class="secondary" type="button">Apply</button>
            <button id="resetUserFiltersBtn" class="secondary" type="button">Reset</button>
        </div>

        <div class="toolbar">
            <button id="bulkDeactivateBtn" class="danger" type="button">Deactivate Selected</button>
            <button id="bulkActivateBtn" class="secondary" type="button">Activate Selected</button>
            <button id="refreshUsersBtn" class="secondary" type="button">Refresh Users</button>
            <button id="showAddUserBtn" class="secondary" type="button">Add New User</button>
        </div>

        <div id="addUserSection" class="form-grid" style="display:none; margin-top:12px;">
            <div class="form-field">
                <label for="newUsername">Username</label>
                <input id="newUsername" type="text" placeholder="username">
            </div>
            <div class="form-field">
                <label for="newFullName">Full Name</label>
                <input id="newFullName" type="text" placeholder="Full name">
            </div>
            <div class="form-field">
                <label for="newPassword">Password</label>
                <input id="newPassword" type="password" placeholder="Password">
            </div>
            <div class="form-field">
                <label for="newRole">Role</label>
                <select id="newRole">
                    <option value="STUDENT" selected>Student</option>
                    <option value="STAFF">Staff</option>
                    <option value="AUTHOR">Author</option>
                    <option value="LIBRARIAN">Librarian</option>
                </select>
            </div>
            <div class="form-field" id="newBioField" style="display:none;">
                <label for="newBio">Author Bio</label>
                <textarea id="newBio" rows="2" placeholder="Optional bio"></textarea>
            </div>
            <div class="form-field" id="newEmployeeIdField" style="display:none;">
                <label for="newEmployeeId">Employee ID</label>
                <input id="newEmployeeId" type="text" placeholder="EMP-001">
            </div>
            <div class="form-field full toolbar">
                <button id="createUserBtn" class="secondary" type="button">Create User</button>
                <button id="cancelAddUserBtn" class="secondary" type="button">Cancel</button>
            </div>
        </div>

        <p id="usersStatus" class="hint">Loading users...</p>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th><input id="selectAllUsers" type="checkbox" aria-label="Select all users"></th>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Last Login</th>
                    <th>Borrow Activity</th>
                    <th>Recent Activity</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>
        <p id="usersSelectionHint" class="hint">Selected: 0 user(s).</p>
    </section>
</main>

<div id="toast"></div>
<script src="background-animation.js"></script>
<script src="shared.js"></script>
<script src="librarian-users.js"></script>
</body>
</html>
