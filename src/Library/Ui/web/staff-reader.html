<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Staff Reader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header class="topbar page-top">
    <div>
        <h1>Borrowed Book Reader</h1>
        <p id="welcomeLine"></p>
    </div>
    <div class="top-actions">
        <a class="link-btn" href="mainStaff.html">Staff Main</a>
        <a class="link-btn" href="staff-borrows.html">My Borrows</a>
        <button id="logoutBtn" class="secondary">Logout</button>
    </div>
</header>

<main class="layout single-col" data-role="STAFF">
    <section class="panel glass-panel">
        <h2>Select Borrowed Book To Read</h2>
        <ul id="borrows"></ul>

        <h3>Reader</h3>
        <div id="readerBox" class="panel-subtle">
            <p id="readerStatus">Select a borrowed book and click Read.</p>
            <iframe id="readerPdf" style="display:none;width:100%;height:360px;border:1px solid #d9d9d9;border-radius:8px;"></iframe>
            <pre id="readerText" style="display:none;white-space:pre-wrap;background:#f8f8f8;padding:12px;border-radius:8px;"></pre>
            <div class="inline-row" style="margin-top:10px;">
                <label for="bookmarkPage">Bookmark Page</label>
                <input id="bookmarkPage" type="number" min="1" value="1">
                <select id="bookmarkPageSelect" style="display:none;"></select>
            </div>
            <p id="bookmarkRangeHint" class="hint">Bookmark page range will be detected after opening a PDF.</p>
            <label for="highlightsInput">Highlights (one line per highlight)</label>
            <textarea id="highlightsInput" rows="4" placeholder="Important quote on line 1&#10;Important quote on line 2"></textarea>
            <button id="saveProgressBtn" class="secondary" type="button">Save Bookmark/Highlights</button>
        </div>
    </section>
</main>

<div id="toast"></div>
<script src="background-animation.js"></script>
<script src="shared.js"></script>
<script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="staff-reader.js"></script>
</body>
</html>
