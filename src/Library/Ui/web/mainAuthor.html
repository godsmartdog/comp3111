<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | Author Main</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header class="topbar page-top">
    <div>
        <h1>Author Main Portal</h1>
        <p id="welcomeLine"></p>
    </div>
    <div class="top-actions">
        <a class="link-btn" href="profile-author.html">Profile</a>
        <a class="link-btn" href="author-stats.html">Statistic</a>
        <a class="link-btn" href="archived-notifications.html">Archived</a>
        <a class="link-btn" href="index.html">Main</a>
        <button id="logoutBtn" class="secondary">Logout</button>
    </div>
</header>

<main class="layout single-col" data-role="AUTHOR">
    <section class="panel glass-panel">
        <h2>Author Functions</h2>
        <p class="hint"></p>
        <div class="quick-links author-main-quick-links">
            <a class="link-btn" href="author-submission.html">Book Submission</a>
            <a class="link-btn" href="author-submitted.html">My Submitted Books</a>
            <a class="link-btn" href="author-published.html">My Published Books</a>
            <a class="link-btn" href="author-reviews.html">Reviews & Replies</a>
        </div>

        <h3>Notification Board</h3>
        <div id="notificationBox" class="panel-subtle">
            <p id="notificationStatus">Loading notifications...</p>
            <div class="toolbar">
                <input id="notificationKeyword" type="text" placeholder="Search notifications...">
                <select id="notificationPriorityFilter" aria-label="Notification highlight filter">
                    <option value="all" selected>All</option>
                    <option value="high">Highlighted (!)</option>
                    <option value="normal">Normal</option>
                    <option value="low">Low</option>
                </select>
                <select id="notificationCategoryFilter" aria-label="Notification category filter">
                    <option value="all" selected>All Categories</option>
                    <option value="submission">Submission</option>
                    <option value="account-update">Account Update</option>
                    <option value="borrow-reminder">Borrow Reminder</option>
                    <option value="book-deleted">Book Deleted</option>
                    <option value="announcement">Announcement</option>
                    <option value="auto-return">Auto Return</option>
                    <option value="other">Other</option>
                </select>
                <input id="notificationDateFrom" type="date" aria-label="Notification date from">
                <input id="notificationDateTo" type="date" aria-label="Notification date to">
                <button id="applyNotificationFiltersBtn" class="secondary" type="button">Apply Filters</button>
            </div>
            <button id="refreshNotificationsBtn" class="secondary" type="button">Refresh Notifications</button>
            <ul id="notificationsList"></ul>
            <div class="pager-row">
                <button id="notificationPrevPageBtn" type="button" class="secondary pager-btn">&lt;</button>
                <span id="notificationPageInfo">1/1</span>
                <button id="notificationNextPageBtn" type="button" class="secondary pager-btn">&gt;</button>
            </div>
        </div>
    </section>
</main>

<div id="toast"></div>
<script src="background-animation.js"></script>
<script src="shared.js"></script>
<script src="main-author.js"></script>
</body>
</html>
